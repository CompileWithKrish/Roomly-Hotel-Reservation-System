# ====================================================================
# Render Blueprint (Infrastructure-as-Code)
# Deploys PostgreSQL 16, Spring Boot Web Service, and React Static Site
# ====================================================================

databases:
  - name: roomly-db
    databaseName: roomly_db
    user: roomly_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # ------------------------------------------------------------------
  # Backend API - Dockerized Spring Boot Web Service
  # ------------------------------------------------------------------
  - type: web
    name: roomly-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Point to Render Managed PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: roomly-db
          property: connectionString
      # Strong auto-generated secret for production JWT signing
      - key: JWT_SECRET
        generateValue: true
      # Dynamically reference the generated frontend static site host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: roomly-frontend
          property: host

  # ------------------------------------------------------------------
  # Frontend Client - Vite React Static Site
  # (No plan or region field: static sites are free and global CDN-hosted)
  # ------------------------------------------------------------------
  - type: web
    name: roomly-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Single-Page Application (SPA) client-side rewrite fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Dynamically reference the generated backend host
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: roomly-backend
          property: host
